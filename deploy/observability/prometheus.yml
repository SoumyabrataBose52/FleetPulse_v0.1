global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: /metrics

  - job_name: 'normalizer'
    static_configs:
      - targets: ['normalizer:8082']
    metrics_path: /metrics

  - job_name: 'orderer'
    static_configs:
      - targets: ['orderer:8083']
    metrics_path: /metrics

  - job_name: 'stream-engine-fast'
    static_configs:
      - targets: ['stream-engine-fast:8084']
    metrics_path: /metrics

  - job_name: 'telemetry-sink'
    static_configs:
      - targets: ['telemetry-sink:8086']
    metrics_path: /metrics

  - job_name: 'insight-sink'
    static_configs:
      - targets: ['insight-sink:8087']
    metrics_path: /metrics

  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: 'simulator'
    static_configs:
      - targets: ['simulator:8090']
    metrics_path: /metrics
