name: Build & Publish Container Images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: ./services/gateway
            dockerfile: ./services/gateway/Dockerfile
          - service: normalizer
            context: ./services/normalizer
            dockerfile: ./services/normalizer/Dockerfile
          - service: orderer
            context: ./services/orderer
            dockerfile: ./services/orderer/Dockerfile
          - service: stream-engine
            context: ./services/stream-engine
            dockerfile: ./services/stream-engine/Dockerfile
          - service: telemetry-sink
            context: ./services/telemetry-sink
            dockerfile: ./services/telemetry-sink/Dockerfile
          - service: insight-sink
            context: ./services/insight-sink
            dockerfile: ./services/insight-sink/Dockerfile
          - service: api
            context: .
            dockerfile: ./services/api/Dockerfile
          - service: simulator
            context: .
            dockerfile: ./services/simulator/Dockerfile
          - service: archiver
            context: .
            dockerfile: ./services/archiver/Dockerfile
          - service: web
            context: .
            dockerfile: ./services/web/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image tags (ensuring lowercase)
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${OWNER_LC}/fleetpulse-${{ matrix.service }}"
          echo "tag_latest=${IMAGE_BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE_BASE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.tags.outputs.tag_latest }}
            ${{ steps.tags.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
